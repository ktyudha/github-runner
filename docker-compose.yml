name: github-runner

services:
  github-runner:
    image: myoung34/github-runner:${RUNNER_IMAGE_TAG:-latest}
    container_name: github-runner
    restart: unless-stopped
    dns:
      - ${DNS1:-1.1.1.1}
      - ${DNS2:-8.8.8.8}
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      RUNNER_SCOPE: ${RUNNER_SCOPE:-repo}        # repo | org
      REPO_URL: ${REPO_URL:-}
      ORG_NAME: ${ORG_NAME:-}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      RUNNER_NAME: ${RUNNER_NAME:-self-hosted-runner}
      LABELS: ${RUNNER_LABELS:-self-hosted,docker}
      RUNNER_GROUP: ${RUNNER_GROUP:-}
      EPHEMERAL: ${EPHEMERAL:-}
      # path kerja HARUS sama di host dan di container (agar `container:` di workflow jalan)
      RUNNER_WORKDIR: ${WORK_DIR:-/opt/github-runner/work}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORK_DIR:-/opt/github-runner/work}:${WORK_DIR:-/opt/github-runner/work}
    stop_grace_period: 1m
